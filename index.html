<h1>PHẦN II. Câu trắc nghiệm đúng sai</h1>
<p class="sub">Chủ đề: Cân bằng hoá học – Lớp 11A. Trong mỗi câu, chọn <b>Đúng</b> hoặc <b>Sai</b> ở từng ý a), b), c), d). Bấm vào từng ý để hiện đáp án và giải thích.</p>
<div class="bar"><button onclick="all(1)">Hiện tất cả đáp án</button><button onclick="all(0)">Ẩn tất cả</button></div>
<div id="root"></div>
<p class="note">Đáp án được kiểm tra lại theo kiến thức hoá học. Phần III (trả lời ngắn) không có trong ảnh nên chưa được chuyển.</p>

['Khi tăng nhiệt độ, cân bằng (1) chuyển dịch sang phải, cân bằng (2) chuyển dịch sang trái.',1,'(1) thu nhiệt → phải; (2) toả nhiệt → trái.']]},
{n:12,t:'Nung vôi:',e:'CaCO<sub>3</sub>(s) ⇌ CaO(s) + CO<sub>2</sub>(g) &nbsp; Δ<sub>r</sub>H°<sub>298</sub> = +179,2 kJ',i:[
['Để thu được nhiều vôi sống hơn cần thiết kế để khí CO<sub>2</sub> thoát ra khỏi lò nhanh hơn để cân bằng chuyển dịch theo chiều thuận.',1,'Lấy bớt CO<sub>2</sub> → giảm nồng độ sản phẩm → dịch theo chiều thuận.'],
['Tăng nhiệt độ của hệ để cân bằng chuyển dịch theo chiều thu nhiệt, tức là chiều thuận.',1,'Δ<sub>r</sub>H° &gt; 0 nên chiều thuận thu nhiệt.'],
['Biểu thức hằng số cân bằng của phản ứng là K<sub>C</sub> = [CaO]·[CO<sub>2</sub>]/[CaCO<sub>3</sub>].',0,'Chất rắn không có mặt trong biểu thức K<sub>C</sub>: K<sub>C</sub> = [CO<sub>2</sub>].'],
['Để làm tăng hiệu suất của phản ứng nung đá vôi nên nghiền mịn đá vôi thành bột mịn.',0,'Nghiền mịn chỉ tăng tốc độ (diện tích tiếp xúc), không làm chuyển dịch cân bằng nên không tăng hiệu suất.']]},
{n:13,t:'Sự hô hấp của người liên quan đến phản ứng: Hb(aq) + O<sub>2</sub>(g) ⇌ HbO<sub>2</sub>(aq). Hemoglobin (Hb) hấp thụ oxygen ở phổi tạo ra HbO<sub>2</sub>.',i:[
['Ở phổi, nồng độ oxygen lớn nhất nên cân bằng chuyển dịch sang phải.',1,'Tăng [O<sub>2</sub>] → cân bằng dịch theo chiều thuận, tạo HbO<sub>2</sub>.'],
['Người bệnh khó thở thường dùng oxygen ở nồng độ thấp hơn bình thường để thở.',0,'Họ dùng oxygen nồng độ <b>cao hơn</b> để cân bằng dịch sang phải, tạo nhiều HbO<sub>2</sub>.'],
['Khi lên núi cao, một số người bị đau đầu, chóng mặt do oxygen loãng làm cân bằng chuyển dịch theo chiều nghịch, giải phóng oxygen.',1,'[O<sub>2</sub>] giảm → cân bằng dịch theo chiều nghịch, HbO<sub>2</sub> giảm, cơ thể thiếu oxygen.'],
['Nếu không khí có lẫn CO, cơ thể nhanh bị ngộ độc vì CO liên kết với Hb tạo COHb, làm giảm khả năng vận chuyển oxygen của máu.',1,'CO bám vào Hb rất bền, chiếm chỗ của O<sub>2</sub>.']]},
{n:14,t:'Trong dung dịch muối CoCl<sub>2</sub> (màu hồng) tồn tại cân bằng:',e:'[Co(H<sub>2</sub>O)<sub>6</sub>]<sup>2+</sup> (hồng) + 4Cl<sup>−</sup> ⇌ [CoCl<sub>4</sub>]<sup>2−</sup> (xanh) + 6H<sub>2</sub>O &nbsp; Δ<sub>r</sub>H°<sub>298</sub> &gt; 0',i:[
['Thêm từ từ HCl đặc vào hệ, dung dịch chuyển dần sang màu hồng.',0,'Tăng [Cl<sup>−</sup>] → chiều thuận → màu <b>xanh</b>.'],
['Ngâm ống nghiệm vào cốc nước nóng, dung dịch chuyển dần sang màu xanh.',1,'Chiều thuận thu nhiệt; tăng nhiệt độ → dịch thuận → xanh.'],
['Thêm một vài giọt dung dịch AgNO<sub>3</sub>, dung dịch chuyển dần sang màu xanh.',0,'Ag<sup>+</sup> + Cl<sup>−</sup> → AgCl↓ làm giảm [Cl<sup>−</sup>] → chiều nghịch → màu <b>hồng</b>.'],
['Ngâm ống nghiệm vào cốc nước lạnh, dung dịch chuyển dần sang màu hồng.',1,'Giảm nhiệt độ → dịch theo chiều toả nhiệt (nghịch) → hồng.']]},
{n:15,t:'H<sub>2</sub>(g) + I<sub>2</sub>(g) ⇌ 2HI(g). Cho 1 mol H<sub>2</sub> và 1 mol I<sub>2</sub> vào bình kín 2 lít. Lượng HI theo thời gian được biểu diễn trên đồ thị (đọc từ đồ thị: HI ở cân bằng ≈ 1,7 mol).',e:G15,i:[
['Nồng độ của HI ở thời điểm cân bằng là 1,7M.',0,'1,7 là <b>số mol</b>. [HI] = 1,7/2 = <b>0,85M</b>.'],
['Nồng độ của I<sub>2</sub>, H<sub>2</sub> ở thời điểm cân bằng đều là 0,5M.',0,'HI tạo 1,7 mol dùng 0,85 mol mỗi chất; còn 0,15 mol → [H<sub>2</sub>] = [I<sub>2</sub>] = 0,075M.'],
['Giá trị hằng số cân bằng của phản ứng là K<sub>C</sub> = 128,44.',1,'K<sub>C</sub> = 0,85² / (0,075·0,075) = 0,7225/0,005625 ≈ 128,44.'],
['Hiệu suất của phản ứng trên là 85%.',1,'H = 0,85/1 × 100% = 85% (cũng bằng 1,7/2).']]}
];
const R=document.getElementById('root');
Q.forEach(q=>{const d=document.createElement('div');d.className='q';
d.innerHTML=`<h2>Câu ${q.n}.</h2><div>${q.t}</div>${q.e?`<div class="eq">${q.e}</div>`:''}`+
q.i.map((x,k)=>`<div class="it ${x[1]?'T':'F'}" onclick="this.classList.toggle('show')"><div class="t"><b>${'abcd'[k]}.</b> ${x[0]}</div><div class="ans"><span class="tag">${x[1]?'ĐÚNG':'SAI'}</span>${x[2]}</div></div>`).join('');
R.appendChild(d)});
function all(v){document.querySelectorAll('.it').forEach(e=>e.classList.toggle('show',!!v))}
</script></body></html>
